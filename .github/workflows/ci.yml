name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Repository health
        run: npm run health
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm run test:unit -- --runInBand
      - run: npm run build
      - run: npm run test:e2e:smoke
      - name: Run Peerovo-backed WebRTC suite
        if: ${{ vars.PEEROVO_E2E_API_URL != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm run test:e2e:webrtc
        env:
          PEEROVO_API_URL: ${{ vars.PEEROVO_E2E_API_URL }}
          PEEROVO_PROJECT_ID: ${{ vars.PEEROVO_E2E_PROJECT_ID }}
          PEEROVO_PROJECT_API_KEY: ${{ secrets.PEEROVO_E2E_PROJECT_API_KEY }}
          ROOM_TOKEN_SECRET: ci-room-token-secret
