name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Repository health
        run: npm run health
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm run test:unit -- --runInBand
      - run: npm run build
      - run: npm run test:e2e:smoke
      - name: Run authenticated PeerJS signaling and WebRTC suite
        run: |
          npm run signaling > /tmp/hostpresent-peerjs.log 2>&1 &
          peerjs_pid=$!
          trap 'kill "$peerjs_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/9000) >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ] || ! kill -0 "$peerjs_pid" 2>/dev/null; then
            cat /tmp/hostpresent-peerjs.log
            exit 1
          fi
          npm run test:e2e:webrtc
        env:
          SIGNALING_SERVER_URL: 127.0.0.1
          SIGNALING_SERVER_PORT: "9000"
          SIGNALING_SERVER_PATH: /
          SIGNALING_SERVER_KEY: peerjs
          SIGNALING_AUTH_MODE: room-token-v1
          ROOM_TOKEN_SECRET: ci-room-token-secret
          INTERNAL_AUTH_SECRET: ci-internal-auth-secret
          TURN_SECRET_KEY: ci-turn-secret
          TURN_DOMAIN: 127.0.0.1
