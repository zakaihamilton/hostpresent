name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Repository health
        run: pnpm run health -- --details
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm run lint
      - run: pnpm run test:unit -- --runInBand
      - run: pnpm run build
      - run: pnpm run test:e2e:smoke
      - name: Run Peerovo-backed WebRTC suite
        if: ${{ vars.PEEROVO_E2E_API_URL != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: pnpm run test:e2e:webrtc
        env:
          PEEROVO_API_URL: ${{ vars.PEEROVO_E2E_API_URL }}
          PEEROVO_PROJECT_ID: ${{ vars.PEEROVO_E2E_PROJECT_ID }}
          PEEROVO_PROJECT_API_KEY: ${{ secrets.PEEROVO_E2E_PROJECT_API_KEY }}
          ROOM_TOKEN_SECRET: ci-room-token-secret-with-at-least-32-bytes

  visual-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run health:visual
        env:
          RUN_VISUAL_REGRESSION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
